<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" role="img" aria-labelledby="title description">
  <title id="title">Desktop home page wireframe diagram — Corani Trout Restaurant</title>
  <desc id="description">
    Diagram-style desktop wireframe using labeled boxes for the header, hero,
    introduction, featured trout dishes, visit information, and footer.
  </desc>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263a2d;
    }

    .canvas-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .copy {
      font-size: 15px;
    }

    .small {
      font-size: 12px;
    }

    .strong {
      font-size: 18px;
      font-weight: 700;
    }

    .frame {
      fill: #fff;
      stroke: #334155;
      stroke-width: 2;
    }

    .section {
      fill: #f8faf8;
      stroke: #647568;
      stroke-width: 2;
    }

    .component {
      fill: #fff;
      stroke: #647568;
      stroke-width: 1.5;
    }

    .photo {
      fill: #edf2eb;
      stroke: #647568;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }

    .rule {
      stroke: #647568;
      stroke-width: 1.5;
    }
  </style>

  <rect width="1200" height="1110" fill="#fff" />
  <text x="30" y="32" class="canvas-title">HOME PAGE / DESKTOP WIREFRAME</text>

  <rect x="30" y="52" width="1140" height="1030" rx="4" class="frame" />
  <rect x="30" y="52" width="1140" height="38" fill="#eef2ee" stroke="#334155" stroke-width="2" />
  <circle cx="50" cy="71" r="5" fill="#9cab94" />
  <circle cx="68" cy="71" r="5" fill="#9cab94" />
  <circle cx="86" cy="71" r="5" fill="#9cab94" />
  <rect x="415" y="60" width="370" height="22" rx="4" class="component" />
  <text x="600" y="76" text-anchor="middle" class="small">coranitrout.com</text>

  <g aria-label="Header region">
    <rect x="50" y="105" width="1100" height="76" class="section" />
    <rect x="65" y="117" width="245" height="52" class="component" />
    <circle cx="88" cy="143" r="11" fill="#edf2eb" stroke="#334155" stroke-width="1.5" />
    <text x="108" y="140" class="section-label">CORANI TROUT</text>
    <text x="108" y="157" class="small">Restaurant logo</text>
    <rect x="642" y="124" width="76" height="36" class="component" />
    <rect x="728" y="124" width="76" height="36" class="component" />
    <rect x="814" y="124" width="112" height="36" class="component" />
    <text x="680" y="147" text-anchor="middle" class="small">Home</text>
    <text x="766" y="147" text-anchor="middle" class="small">Menu</text>
    <text x="870" y="147" text-anchor="middle" class="small">Location</text>
    <rect x="986" y="124" width="145" height="36" fill="#e8efe3" stroke="#334155" stroke-width="1.5" />
    <text x="1058" y="147" text-anchor="middle" class="small">Contact action</text>
  </g>

  <g aria-label="Hero region">
    <rect x="50" y="198" width="1100" height="252" class="section" />
    <text x="70" y="221" class="section-label">HERO / LANDSCAPE INTRODUCTION</text>
    <rect x="70" y="235" width="540" height="195" class="component" />
    <text x="91" y="267" class="small">Eyebrow / local restaurant message</text>
    <text x="91" y="310" class="strong">Fresh trout. Unforgettable views.</text>
    <text x="91" y="339" class="copy">Short introduction to the restaurant and Laguna Corani.</text>
    <rect x="91" y="365" width="145" height="42" fill="#e8efe3" stroke="#334155" stroke-width="1.5" />
    <text x="163" y="391" text-anchor="middle" class="small">Explore menu</text>
    <rect x="625" y="235" width="505" height="195" class="photo" />
    <path d="M625 235l505 195m0-195L625 430" class="rule" />
    <text x="877" y="326" text-anchor="middle" class="section-label">LANDSCAPE / HERO IMAGE</text>
  </g>

  <g aria-label="Restaurant introduction region">
    <rect x="50" y="466" width="1100" height="142" class="section" />
    <text x="70" y="490" class="section-label">RESTAURANT INTRODUCTION</text>
    <text x="70" y="524" class="strong">Local flavor, naturally.</text>
    <text x="70" y="550" class="copy">Brief story about locally farmed trout and the lake setting.</text>
    <text x="70" y="577" class="small">Supporting copy</text>
    <rect x="780" y="482" width="350" height="110" class="photo" />
    <path d="M780 482l350 110m0-110L780 592" class="rule" />
    <text x="955" y="542" text-anchor="middle" class="small">Restaurant / lake image</text>
  </g>

  <g aria-label="Featured menu region">
    <rect x="50" y="624" width="1100" height="232" class="section" />
    <text x="70" y="652" class="section-label">FEATURED MENU ITEMS</text>
    <text x="70" y="681" class="strong">Featured from the kitchen</text>
    <text x="1128" y="679" text-anchor="end" class="small">Link: full menu</text>

    <g aria-label="Trout with garlic card">
      <rect x="70" y="699" width="335" height="137" class="component" />
      <rect x="82" y="710" width="92" height="74" class="photo" />
      <path d="M82 710l92 74m0-74-92 74" class="rule" />
      <text x="186" y="729" class="section-label">DISH IMAGE</text>
      <text x="186" y="753" class="copy">Trout with garlic</text>
      <text x="186" y="775" class="small">Description / estimated price</text>
      <text x="82" y="812" class="small">Menu item card</text>
    </g>
    <g aria-label="Trout chicharrón card">
      <rect x="425" y="699" width="335" height="137" class="component" />
      <rect x="437" y="710" width="92" height="74" class="photo" />
      <path d="M437 710l92 74m0-74-92 74" class="rule" />
      <text x="541" y="729" class="section-label">DISH IMAGE</text>
      <text x="541" y="753" class="copy">Trout chicharrón</text>
      <text x="541" y="775" class="small">Description / estimated price</text>
      <text x="437" y="812" class="small">Menu item card</text>
    </g>
    <g aria-label="Trout with butter card">
      <rect x="780" y="699" width="350" height="137" class="component" />
      <rect x="792" y="710" width="92" height="74" class="photo" />
      <path d="M792 710l92 74m0-74-92 74" class="rule" />
      <text x="896" y="729" class="section-label">DISH IMAGE</text>
      <text x="896" y="753" class="copy">Trout with butter</text>
      <text x="896" y="775" class="small">Description / estimated price</text>
      <text x="792" y="812" class="small">Menu item card</text>
    </g>
  </g>

  <g aria-label="Visit information region">
    <rect x="50" y="872" width="1100" height="112" class="section" />
    <text x="70" y="897" class="section-label">VISITOR INFORMATION</text>
    <rect x="70" y="909" width="335" height="58" class="component" />
    <rect x="425" y="909" width="335" height="58" class="component" />
    <rect x="780" y="909" width="350" height="58" class="component" />
    <text x="87" y="934" class="copy">Hours</text>
    <text x="87" y="954" class="small">Confirmed business hours</text>
    <text x="442" y="934" class="copy">Location</text>
    <text x="442" y="954" class="small">Map / directions from Route 4</text>
    <text x="797" y="934" class="copy">WhatsApp</text>
    <text x="797" y="954" class="small">Questions and reservations</text>
  </g>

  <g aria-label="Footer region">
    <rect x="50" y="1000" width="1100" height="62" class="section" />
    <text x="70" y="1037" class="copy">Footer: restaurant name, location, contact, social links</text>
  </g>
</svg>
